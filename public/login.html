<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — KrishiRakshak</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>
    <div class="auth-page">
        <!-- Left Visual Panel -->
        <div class="auth-visual">
            <div class="auth-visual-content">
                <div class="visual-icon">🌾</div>
                <h2>KrishiRakshak</h2>
                <p>Protecting crops with AI-powered intelligence. Real-time alerts for smarter farming decisions.</p>
                <div style="margin-top:40px;display:flex;gap:24px;justify-content:center;">
                    <div style="text-align:center;">
                        <div style="font-size:1.8rem;font-weight:800;color:var(--accent-gold);">🔬</div>
                        <div style="font-size:0.8rem;opacity:0.7;">AI Detection</div>
                    </div>
                    <div style="text-align:center;">
                        <div style="font-size:1.8rem;font-weight:800;color:var(--accent-gold);">🔔</div>
                        <div style="font-size:0.8rem;opacity:0.7;">Live Alerts</div>
                    </div>
                    <div style="text-align:center;">
                        <div style="font-size:1.8rem;font-weight:800;color:var(--accent-gold);">🌤️</div>
                        <div style="font-size:0.8rem;opacity:0.7;">Weather Intel</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Form Panel -->
        <div class="auth-form-wrapper">
            <div class="auth-form-container">
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:32px;">
                    <div class="lang-selector">
                        <button class="lang-btn active" data-lang="en">EN</button>
                        <button class="lang-btn" data-lang="hi">हिं</button>
                        <button class="lang-btn" data-lang="pa">ਪੰ</button>
                    </div>
                </div>

                <h1 data-i18n="loginTitle">Welcome Back</h1>
                <p class="auth-subtitle" data-i18n="loginSubtitle">Sign in to your KrishiRakshak account</p>

                <form class="auth-form" id="login-form" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label class="form-label" data-i18n="email">Email Address</label>
                        <input type="email" class="form-input" id="login-email" name="email" placeholder="farmer@example.com" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" style="display:flex;justify-content:space-between;">
                            <span data-i18n="password">Password</span>
                            <a href="#" style="font-size:0.8rem;" data-i18n="forgotPassword">Forgot Password?</a>
                        </label>
                        <input type="password" class="form-input" id="login-password" name="password" placeholder="••••••••" required minlength="6">
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg" style="width:100%;" id="login-btn">
                        <span data-i18n="login">Login</span>
                    </button>
                </form>

                <div class="auth-divider" data-i18n="orContinueWith">Or continue with</div>

                <button class="google-btn" onclick="handleGoogleLogin()">
                    <span style="font-size:1.2rem;">G</span>
                    <span>Google</span>
                </button>

                <p class="auth-footer" style="margin-top:24px;">
                    <span data-i18n="noAccount">Don't have an account?</span>
                    <a href="/signup.html" data-i18n="signup">Sign Up</a>
                </p>
            </div>
        </div>
    </div>

    <script src="/js/i18n.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        // Redirect if already logged in
        if (auth.isLoggedIn()) {
            auth.redirectToDashboard();
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            btn.innerHTML = '<div class="spinner" style="width:20px;height:20px;border-width:2px;margin:0 auto;"></div>';
            btn.disabled = true;

            const result = await auth.login(email, password);

            if (result.success) {
                Toast.success('Welcome!', `Logged in as ${result.user.name}`);
                setTimeout(() => auth.redirectToDashboard(), 800);
            } else {
                Toast.error('Login Failed', result.message || 'Invalid email or password.');
                btn.innerHTML = '<span data-i18n="login">Login</span>';
                btn.disabled = false;
            }
        }

        async function handleGoogleLogin() {
            const result = await auth.googleSignIn();
            if (result.success) {
                Toast.success('Welcome!', `Signed in as ${result.user.name}`);
                setTimeout(() => auth.redirectToDashboard(), 800);
            } else {
                Toast.error('Google Sign-In', result.message || 'Could not sign in with Google.');
            }
        }
    </script>
</body>
</html>
